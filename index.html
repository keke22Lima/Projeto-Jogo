<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samurai Shadow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; font-family: 'Press Start 2P', cursive; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at center, #1d1b3b 0%, #090814 55%, #03020a 100%); }
    body { display: flex; justify-content: center; align-items: center; color: white; }
    .game-shell { position: relative; width: 1024px; height: 576px; max-width: 100vw; max-height: 100vh; box-shadow: 0 0 35px rgba(124,58,237,.65), 0 0 90px rgba(239,68,68,.28); border: 4px solid rgba(255,255,255,.8); overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 12px; z-index: 5; }
    .life-wrap { position: relative; flex: 1; height: 34px; border: 4px solid #fff; background: #7f1d1d; box-shadow: inset 0 0 12px rgba(0,0,0,.65), 0 4px 0 rgba(0,0,0,.35); }
    .life-wrap.left { border-radius: 16px 4px 4px 16px; }
    .life-wrap.right { border-radius: 4px 16px 16px 4px; }
    .life-red { position: absolute; inset: 0; background: linear-gradient(90deg, #7f1d1d, #ef4444); }
    .life-blue { position: absolute; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, #22c55e, #a3e635); transition: width .28s ease; }
    #playerHealth { right: 0; }
    #enemyHealth { left: 0; }
    .name { position: absolute; top: -18px; font-size: 10px; color: #fde68a; text-shadow: 2px 2px #000; }
    .left .name { left: 4px; }
    .right .name { right: 4px; }
    #timer { width: 86px; height: 58px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #111827, #020617); border: 4px solid #fff; border-radius: 12px; font-size: 20px; color: #fef3c7; box-shadow: 0 0 20px rgba(251,191,36,.4); }
    .controls { position: absolute; left: 16px; bottom: 12px; z-index: 4; padding: 10px 12px; border: 2px solid rgba(255,255,255,.45); border-radius: 12px; background: rgba(0,0,0,.45); font-size: 9px; line-height: 1.8; color: #e5e7eb; text-shadow: 2px 2px #000; }
    .story-box { position: absolute; right: 16px; bottom: 12px; z-index: 4; width: 360px; max-width: calc(100% - 32px); padding: 12px; border: 2px solid rgba(250,204,21,.75); border-radius: 12px; background: rgba(0,0,0,.55); box-shadow: 0 0 18px rgba(250,204,21,.2); text-shadow: 2px 2px #000; }
    #faseName { color: #facc15; font-size: 10px; margin-bottom: 8px; }
    #storyText { color: #fff; font-size: 8px; line-height: 1.7; }
    #startMenu { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background-image: linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.42)), url('./img/capa_historia.png'); background-size: cover; background-position: center; text-align: center; }
    #startMenu h1 { margin: 0; color: #facc15; font-size: 42px; text-shadow: 5px 5px #000, 0 0 25px #dc2626; }
    #startMenu p { margin: 0; max-width: 680px; color: #fff; font-size: 12px; line-height: 1.8; text-shadow: 3px 3px #000; }
    #startStoryBtn { cursor: pointer; border: 4px solid #fff; border-radius: 16px; background: linear-gradient(180deg, #f59e0b, #991b1b); color: white; padding: 18px 24px; font-size: 14px; box-shadow: 0 8px 0 #3b0a0a, 0 0 30px rgba(250,204,21,.65); transition: transform .08s ease, filter .2s ease; }
    #startStoryBtn:hover { filter: brightness(1.18); transform: translateY(-2px); }
    #startStoryBtn:active { transform: translateY(5px); box-shadow: 0 3px 0 #3b0a0a; }
    #displayText { position: absolute; inset: 0; z-index: 10; display: none; flex-direction: column; justify-content: center; align-items: center; gap: 20px; background: rgba(3,7,18,.76); backdrop-filter: blur(3px); text-align: center; padding: 24px; }
    #resultTitle { color: #facc15; font-size: 24px; text-shadow: 4px 4px #000; }
    #resultSub { font-size: 11px; line-height: 1.8; color: #fff; }
    #restartBtn { cursor: pointer; border: 4px solid #fff; border-radius: 14px; background: linear-gradient(180deg, #dc2626, #7f1d1d); color: white; padding: 16px 20px; font-size: 12px; box-shadow: 0 8px 0 #350b0b, 0 0 24px rgba(248,113,113,.65); transition: transform .08s ease, filter .2s ease; }
    #restartBtn:hover { filter: brightness(1.15); transform: translateY(-2px); }
    #restartBtn:active { transform: translateY(5px); box-shadow: 0 3px 0 #350b0b; }
    @media (max-width: 900px) { .game-shell { border: none; } .controls { display: none; } #resultTitle { font-size: 18px; } }
  </style>
</head>
<body>
  <div class="game-shell">
    <div id="startMenu">
      <h1>Samurai Shadow</h1>
      <p>Modo História: avance pelos mapas, derrote os samurais e sobreviva aos duelos.</p>
      <button id="startStoryBtn">COMEÇAR HISTÓRIA</button>
    </div>

    <div class="hud">
      <div class="life-wrap left">
        <span class="name">PLAYER 1</span>
        <div class="life-red"></div>
        <div id="playerHealth" class="life-blue"></div>
      </div>
      <div id="timer">60</div>
      <div class="life-wrap right">
        <span class="name">PLAYER 2</span>
        <div class="life-red"></div>
        <div id="enemyHealth" class="life-blue"></div>
      </div>
    </div>

    <div class="controls">
      A/D mover • W pular • Espaço atacar<br />
      Inimigo com IA automática<br />
      R reinicia a luta
    </div>

    <div class="story-box">
      <div id="faseName">Fase 1</div>
      <div id="storyText">Modo história iniciado.</div>
    </div>

    <div id="displayText">
      <div id="resultTitle">EMPATE</div>
      <div id="resultSub">Pressione R ou clique no botão para lutar novamente.</div>
      <button id="restartBtn">REINICIAR LUTA</button>
    </div>

    <canvas></canvas>
  </div>

  <audio id="bgMusic" src="snd/japan.mp3" loop preload="auto"></audio>
  <audio id="deathMusic" src="snd/L.mp3" preload="auto"></audio>

  <script src="js/utils.js"></script>
  <script src="js/classes.js"></script>
  <script src="index.js"></script>
</body>
</html>
